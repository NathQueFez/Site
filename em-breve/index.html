<style>
:root { --cacau: #3B1E10; --dourado: #D4B483; --creme: #F6EBDA; --muted: #CDB896; --whatsapp: #0F7A5C; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: grid; place-items: center; padding: 32px 20px; background: var(--cacau); color: var(--creme); font: 400 17px/1.55 "DM Sans", system-ui, sans-serif; text-align: center; }
main { max-width: 440px; display: grid; gap: 22px; justify-items: center; }
.sig { font: 700 clamp(44px, 12vw, 64px)/1 "Dancing Script", cursive; color: var(--dourado); }
.eyebrow { font: 600 13px/1.2 "Josefin Sans", system-ui, sans-serif; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font: 600 clamp(28px, 7vw, 38px)/1.15 "Cormorant Garamond", Georgia, serif; }
p { margin: 0; color: var(--muted); }
.acoes { display: grid; gap: 12px; width: 100%; }
.btn { display: block; padding: 14px 20px; border-radius: 12px; font-weight: 500; text-decoration: none; }
.btn-primary { background: var(--dourado); color: var(--cacau); }
.btn-wa { border: 1px solid #5A3220; color: var(--creme); }
.btn:focus-visible { outline: 2px solid var(--dourado); outline-offset: 3px; }
.ig { color: var(--dourado); }

</head>
<body>
<main>
  <div class="sig" aria-label="Nath que fez">Nath que fez</div>
