# Netlify: site principal (nathquefez.com.br).
# Enquanto o site não é lançado, publica só a página "Em breve".
# No lançamento: troque publish para "." e tire o X-Robots-Tag.
[build]
  publish = "em-breve"

# O cardápio fica no projeto PEDIDOS; aqui ele aparece em nathquefez.com.br/cardapio.
# Sem regra "/cardapio" -> "/cardapio/": o Netlify ignora a barra final ao
# comparar regras, então ela redirecionava para si mesma (ERR_TOO_MANY_REDIRECTS).
[[redirects]]
  from = "/cardapio/admin.html"
  to = "https://pedidos.nathquefez.com.br/cardapio/admin.html"
  status = 302
  force = true
[[redirects]]
  from = "/cardapio/*"
  to = "https://pedidos.nathquefez.com.br/cardapio/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Referrer-Policy = "strict-origin-when-cross-origin"
